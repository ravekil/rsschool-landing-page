<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="header">
    <div class="container header_main">
        <a href="./index.html" class="logo"></a>

        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"></li>
                <li class="nav__item"></li>
                <li class="nav__item"></li>
                <li class="nav__item"></li>
            </ul>
        </nav>
        <div class="header_action">
            <a href="./menu.html" class="menu_link"></a>
        </div>
    </div>
</header>
<main class="main">
    <section class="hero" id="hero">
        <div class="container hero__container">
            <div class="hero__content">
            <h1 class="hero__title">
                <span>Enjoy</span>
                premium coffee
            </h1>
            <p class="hero__text">
                with inviting
            </p>
            </div>
        </div>
    </section>
    <section class="favorite" id="coffee">
        <div class="favorite__container">
            <h2 class="section-title">Choose your <span>favorite</span> coffee </h2>
        </div>
    </section>
    <section class="about" id="about">
        <div class="container about__container">
            <h2 class="section-title">Resourse is</h2>
        <div class="about__photo">
        </div>
        </div>
    </section>
    <section class="mobile-app" id="mobile-app">
        <div class="container mobile-app__container">
            <h2 class="section-title">Download our app</h2>
            <p class="mobile-app__text">
                Download the resoure app
            </p>
        </div>
    </section>
</main>
<footer class="footer" id="contacts">
    <div class="container footer__container">
    </div>
</footer>

</html>
